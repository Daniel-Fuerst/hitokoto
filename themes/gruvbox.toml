# hitokoto theme "Gruvbox" - a warm dark theme built from Pavel Pertsev's Gruvbox Dark Medium palette:
#   bg0_h  #1d2021   bg0     #282828   bg1   #3c3836   bg2     #504945
#   fg0    #fbf1c7   fg1     #ebdbb2   fg2   #d5c4a1   fg4     #a89984   gray  #928374
#   yellow #d79921   orange  #fe8019   aqua  #689d6a   blue    #83a598   red   #cc241d
# Warm retro neutrals keep long-form writing calm and readable (WCAG AA), while
# earthy gold, orange and aqua carry the interactive accents and subtle element surfaces.
#
# Install: copy to ~/.config/hitokoto/theme.toml (or start with --theme path/to/this/file)
name = "Gruvbox"
base = "dark"

[colors]
primary        = "#d79921"   # neutral yellow: focus rings, default buttons
secondary      = "#689d6a"   # neutral aqua: less prominent highlights
accent         = "#fe8019"   # bright orange: active states, menu highlights, scroll hover
background     = "#282828"   # bg0 (medium dark)
surface        = "#32302f"   # bg0_s: menus, dialogs, toolbars, raised surfaces
border         = "#504945"   # bg2: separators and outlines
text           = "#ebdbb2"   # fg1: warm cream body text
text-muted     = "#a89984"   # fg4: secondary text and hints
selection      = "#504945"   # bg2
selection-text = "#fbf1c7"   # fg0
marker         = "#928374"   # gray: revealed Markdown syntax markers recede behind prose
bullet         = "#fe8019"   # bright orange

[fonts]
ui-family     = ""
ui-size       = 0
editor-family = ""
editor-size   = 12

[headings]
h1-scale = 1.9
h2-scale = 1.55
h3-scale = 1.3
h4-scale = 1.15
h5-scale = 1.05
h6-scale = 1.0
weight   = 700

[layout]
radius           = 6
spacing          = 8
editor-padding   = 32
editor-max-width = 760

[buttons]
style = "filled"

[code-block]
background   = "#1d2021"   # bg0_h: recessed dark panel
border       = "#3c3836"   # bg1: subtle 1px frame
border-width = 1
badge-text   = "#a89984"   # fg4

[inline-code]
background   = "#3c3836"   # bg1 pill
text         = "#fabd2f"   # bright yellow (AA on bg1)
border-width = 0

[emphasis]
italic-text        = "#d5c4a1"   # fg2: warm softened cream for italics
strikethrough-text = "#928374"   # gray: struck-through text recedes

[table]
header-background = "#3c3836"   # bg1
stripe-background = "#242220"   # subtle warm alternating row tint

[link]
text = "#83a598"   # bright blue: calm, distinct link colour

[properties]
unsupported-text  = "#fe8019"   # bright orange
chip-background   = "#3c3836"   # bg1
chip-border       = "#504945"   # bg2
chip-border-width = 1

[find]
no-match-background = "#542522"   # muted Gruvbox red tint
current-background  = "#fabd2f"   # bright yellow
current-text        = "#1d2021"   # bg0_h
match-background    = "#504945"   # bg2
match-text          = "#fbf1c7"   # fg0
