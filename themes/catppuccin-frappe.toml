# hitokoto theme "Catppuccin Frappé" - the subdued twilight flavour of Catppuccin:
#   Base     #303446   Mantle    #292c3c   Crust     #232634   Surface0  #414559   Surface1  #51576d
#   Text     #c6d0f5   Subtext1  #b5bfe2   Subtext0  #a5adce   Overlay1  #838ba7
#   Mauve    #ca9ee6   Blue      #8caaee   Teal      #81c8be   Flamingo  #eebebe   Yellow    #e5c890
# Soft slate-blue surfaces and low-glare pastel accents keep focus on the text.
#
# Install: copy to ~/.config/hitokoto/theme.toml (or start with --theme path/to/this/file)
name = "Catppuccin Frappé"
base = "dark"

[colors]
primary        = "#ca9ee6"   # Mauve: focus rings, default buttons
secondary      = "#81c8be"   # Teal: less prominent highlights
accent         = "#8caaee"   # Blue: active states, menu highlights, scroll hover
background     = "#303446"   # Base
surface        = "#292c3c"   # Mantle: menus, dialogs, toolbars, raised surfaces
border         = "#51576d"   # Surface1: separators and outlines
text           = "#c6d0f5"   # Text
text-muted     = "#a5adce"   # Subtext0
selection      = "#51576d"   # Surface1
selection-text = "#c6d0f5"   # Text
marker         = "#838ba7"   # Overlay1: revealed Markdown syntax markers
bullet         = "#ca9ee6"   # Mauve

[fonts]
ui-family     = ""
ui-size       = 0
editor-family = ""
editor-size   = 12

[headings]
h1-scale = 1.9
h2-scale = 1.55
h3-scale = 1.3
h4-scale = 1.15
h5-scale = 1.05
h6-scale = 1.0
weight   = 700

[layout]
radius           = 6
spacing          = 8
editor-padding   = 32
editor-max-width = 760

[buttons]
style = "filled"

[code-block]
background   = "#292c3c"   # Mantle
border       = "#414559"   # Surface0
border-width = 1
badge-text   = "#a5adce"   # Subtext0

[inline-code]
background   = "#414559"   # Surface0 pill
text         = "#eebebe"   # Flamingo (AA on Surface0)
border-width = 0

[emphasis]
italic-text        = "#b5bfe2"   # Subtext1
strikethrough-text = "#949cbb"   # Overlay2

[table]
header-background = "#292c3c"   # Mantle
stripe-background = "#2c3041"   # subtle alternating row between Base and Mantle

[link]
text = "#8caaee"   # Blue

[properties]
unsupported-text  = "#ef9f76"   # Peach
chip-background   = "#414559"   # Surface0
chip-border       = "#51576d"   # Surface1
chip-border-width = 1

[find]
no-match-background = "#59394c"   # muted Frappé Red tint
current-background  = "#e5c890"   # Yellow
current-text        = "#232634"   # Crust
match-background    = "#51576d"   # Surface1
match-text          = "#c6d0f5"   # Text
