# hitokoto theme "Catppuccin Mocha" - the signature dark flavour of Catppuccin:
#   Base     #1e1e2e   Mantle    #181825   Crust     #11111b   Surface0  #313244   Surface1  #45475a
#   Text     #cdd6f4   Subtext1  #bac2de   Subtext0  #a6adc8   Overlay1  #7f849c
#   Mauve    #cba6f7   Blue      #89b4fa   Teal      #94e2d5   Flamingo  #f2cdcd   Yellow    #f9e2af
# Cozy dark charcoal-indigo surfaces with warm pastel accents and high readability (WCAG AA).
#
# Install: copy to ~/.config/hitokoto/theme.toml (or start with --theme path/to/this/file)
name = "Catppuccin Mocha"
base = "dark"

[colors]
primary        = "#cba6f7"   # Mauve: focus rings, default buttons
secondary      = "#94e2d5"   # Teal: less prominent highlights
accent         = "#89b4fa"   # Blue: active states, menu highlights, scroll hover
background     = "#1e1e2e"   # Base
surface        = "#181825"   # Mantle: menus, dialogs, toolbars, raised surfaces
border         = "#45475a"   # Surface1: separators and outlines
text           = "#cdd6f4"   # Text
text-muted     = "#a6adc8"   # Subtext0
selection      = "#45475a"   # Surface1
selection-text = "#cdd6f4"   # Text
marker         = "#7f849c"   # Overlay1: revealed Markdown syntax markers
bullet         = "#cba6f7"   # Mauve

[fonts]
ui-family     = ""
ui-size       = 0
editor-family = ""
editor-size   = 12

[headings]
h1-scale = 1.9
h2-scale = 1.55
h3-scale = 1.3
h4-scale = 1.15
h5-scale = 1.05
h6-scale = 1.0
weight   = 700

[layout]
radius           = 6
spacing          = 8
editor-padding   = 32
editor-max-width = 760

[buttons]
style = "filled"

[code-block]
background   = "#181825"   # Mantle
border       = "#313244"   # Surface0
border-width = 1
badge-text   = "#a6adc8"   # Subtext0

[inline-code]
background   = "#313244"   # Surface0 pill
text         = "#f2cdcd"   # Flamingo (AA on Surface0)
border-width = 0

[emphasis]
italic-text        = "#bac2de"   # Subtext1
strikethrough-text = "#9399b2"   # Overlay2

[table]
header-background = "#181825"   # Mantle
stripe-background = "#1b1b2a"   # subtle alternating row between Base and Mantle

[link]
text = "#89b4fa"   # Blue

[properties]
unsupported-text  = "#fab387"   # Peach
chip-background   = "#313244"   # Surface0
chip-border       = "#45475a"   # Surface1
chip-border-width = 1

[find]
no-match-background = "#4c2c3e"   # muted Mocha Red tint
current-background  = "#f9e2af"   # Yellow
current-text        = "#11111b"   # Crust
match-background    = "#45475a"   # Surface1
match-text          = "#cdd6f4"   # Text
