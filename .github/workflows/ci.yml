# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Qt versions: 6.12 (ADR 0001) where possible. Windows uses 6.8.3, the oldest supported Qt, until
# an aqtinstall release supports the Qt 6.11+ repository layout for Windows x64 (aqtinstall 3.3.0
# fails with "Failed to locate XML data"; fixed by miurahr/aqtinstall PR 1000, not yet released).
env:
  QT_VERSION: "6.12.0"

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format-18 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  core-sanitizers:
    name: Core with ASan/UBSan, without Qt (layering check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset core-sanitize
      - name: Build
        run: cmake --build --preset core-sanitize --parallel
      - name: Test
        run: ctest --preset core-sanitize

  fuzz:
    name: Fuzz core (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz --parallel
      - name: Run fuzzers
        run: |
          for f in fuzz_codec fuzz_render fuzz_theme; do
            ./build/fuzz/fuzz/$f -max_total_time=60 -print_final_stats=1
          done

  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, qt: "6.12.0", arch: linux_gcc_64, werror: "ON" }
          - { name: Linux min Qt, os: ubuntu-24.04, qt: "6.8.3", arch: linux_gcc_64, werror: "ON" }
          - { name: Windows, os: windows-2022, qt: "6.8.3", arch: win64_msvc2022_64, werror: "OFF" }
          - { name: macOS, os: macos-15, qt: "6.12.0", arch: clang_64, werror: "ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 ninja-build
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        run: cmake --preset ci -DHITOKOTO_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci
        env:
          QT_QPA_PLATFORM: offscreen

  tidy:
    name: Lint (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 clang-tidy-18
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake --preset dev
      - name: Build (generates moc files)
        run: cmake --build --preset dev --parallel
      - name: clang-tidy
        run: run-clang-tidy-18 -p build/dev -quiet "$(pwd)/src/"

  bench:
    name: Benchmarks (${{ matrix.name }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, qt: "6.12.0", arch: linux_gcc_64, baseline: linux }
          - { name: Windows, os: windows-2022, qt: "6.8.3", arch: win64_msvc2022_64, baseline: windows }
          - { name: macOS, os: macos-15, qt: "6.12.0", arch: clang_64, baseline: macos }
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure
        run: cmake --preset bench
      - name: Build
        run: cmake --build --preset bench --parallel
      - name: Core benchmarks
        shell: bash
        run: |
          exe=$(find build/bench -type f \( -name hitokoto_core_bench -o -name hitokoto_core_bench.exe \) | head -1)
          "$exe" --benchmark_out=core-bench.json --benchmark_out_format=json
      - name: End-to-end benchmarks (S006, S007)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe=$(find build/bench -type f \( -name hitokoto-bench -o -name hitokoto-bench.exe \) | head -1)
          "$exe" --runs 10 --output e2e-bench.json --baseline bench/baselines/${{ matrix.baseline }}.json --tolerance 0.25
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.baseline }}
          path: |
            core-bench.json
            e2e-bench.json
