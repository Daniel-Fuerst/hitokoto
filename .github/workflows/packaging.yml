# SPDX-License-Identifier: GPL-3.0-or-later
name: Packaging

on:
  workflow_run:
    workflows: ["Version"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check version tag
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.check_tag.outputs.new_version }}
      tag: ${{ steps.check_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for version tag
        id: check_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch; proceeding with packaging."
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="${{ github.event.workflow_run.head_sha }}"
          tag=$(git tag --points-at "$sha" "v*" | head -n 1)
          if [ -z "$tag" ]; then
            for c in $(git rev-list --max-count=10 "$sha"); do
              tag=$(git tag --points-at "$c" "v*" | head -n 1)
              if [ -n "$tag" ]; then
                break
              fi
            done
          fi

          if [ -n "$tag" ]; then
            echo "Found new version tag $tag on $sha. Proceeding with packaging."
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No version tag on $sha. Skipping packaging."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          fi

  aur:
    name: Update AUR package
    needs: check
    if: needs.check.outputs.new_version == 'true'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Update AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib

          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          trap 'rm -f ~/.ssh/aur' EXIT
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          git config --global core.sshCommand "ssh -i ~/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/hitokoto.git /tmp/aur-pkg
          cd /tmp/aur-pkg

          updpkgsums
          makepkg --printsrcinfo > .SRCINFO

          git config user.name "${{ secrets.AUR_NAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"

          git add -A
          git commit -m "Update hitokoto"
          git push origin master
